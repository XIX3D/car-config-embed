<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Config Embed - Test Page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 40px;
        min-height: 100vh;
        background: #f0f0f0;
      }
      h1 {
        text-align: center;
        margin-bottom: 40px;
        color: #333;
      }
      .test-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .test-card {
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .test-card.dark {
        background: #1a1a1a;
      }
      .test-card h2 {
        margin: 0 0 8px 0;
        font-size: 16px;
        font-weight: 600;
      }
      .test-card.dark h2 {
        color: #fff;
      }
      .test-card p {
        margin: 0 0 20px 0;
        font-size: 13px;
        color: #666;
      }
      .test-card.dark p {
        color: #888;
      }
      .button-container {
        display: flex;
        justify-content: center;
        min-height: 60px;
        align-items: center;
      }
      .api-section {
        max-width: 1200px;
        margin: 40px auto 0;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .api-section h2 {
        margin: 0 0 16px 0;
      }
      .api-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .api-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }
      .api-btn.primary {
        background: linear-gradient(135deg, #44CCFF, #46FF81);
        color: #000;
      }
      .api-btn.primary:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 12px rgba(68, 204, 255, 0.4);
      }
      .api-btn.secondary {
        background: #f0f0f0;
        color: #333;
      }
      .api-btn.secondary:hover {
        background: #e0e0e0;
      }
      .dynamic-container {
        margin-top: 20px;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 12px;
        min-height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dynamic-container:empty::before {
        content: 'Dynamic buttons will appear here';
        color: #999;
        font-size: 13px;
      }
      code {
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      .info-box {
        background: #e8f4fd;
        border: 1px solid #b8daff;
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 20px;
        font-size: 13px;
        color: #004085;
      }
    </style>
  </head>
  <body>
    <h1>Car Config Embed Widget Test</h1>

    <div class="test-grid">
      <div class="test-card dark" data-theme="dark">
        <h2>HRE Wheel 552 (Dark)</h2>
        <p>HRE Performance Wheels - wheel_id 552</p>
        <div class="button-container">
          <button class="avacar-preview"
            data-jwt="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ3aGVlbF9pZCI6NTUyLCJtYW51ZmFjdHVyZXJfaWQiOjEsImlhdCI6MTc3MjQ2OTc2NSwiZXhwIjoxODA0MDA1NzY1fQ.4JfY5kTMVjYXLruXslN6VUu8rkQYw7OK0z89BQsbeTI"
            data-button-theme="dark"
            data-brand="HRE Performance Wheels">
            Preview On Your Car
          </button>
        </div>
      </div>

      <div class="test-card">
        <h2>Test a Token</h2>
        <p>Paste a JWT token and click the button to test it</p>
        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
          <input id="token-input" type="text" placeholder="Paste JWT token here..." style="flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: monospace;">
          <button onclick="loadToken()" style="padding: 10px 20px; background: #333; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; white-space: nowrap;">Load</button>
        </div>
        <div id="token-button-container" class="button-container"></div>
      </div>
    </div>

    <script type="module" src="/src/index.tsx"></script>
    <script>
      function loadToken() {
        const jwt = document.getElementById('token-input').value.trim();
        if (!jwt) return;

        const container = document.getElementById('token-button-container');
        container.innerHTML = '';

        const btn = document.createElement('button');
        btn.className = 'avacar-preview';
        btn.setAttribute('data-jwt', jwt);
        btn.setAttribute('data-button-theme', 'light');
        btn.setAttribute('data-brand', 'Test');
        btn.textContent = 'Preview On Your Car';
        container.appendChild(btn);

        if (window.AvaCar) {
          window.AvaCar.bindButtons();
        }
      }

      window.loadToken = loadToken;
    </script>
  </body>
</html>
