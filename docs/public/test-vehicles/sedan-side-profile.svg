<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <rect x="0" y="380" width="800" height="120" fill="#0f0f1a" opacity="0.6"/>
  <!-- Car body - side profile -->
  <path d="M120,300 L120,280 Q130,200 250,190 L420,180 Q520,180 560,200 L650,240 L700,270 L700,320 L100,320 L100,300 Z" fill="#2a2a4a" stroke="#3a3a6a" stroke-width="2"/>
  <!-- Windows -->
  <path d="M220,270 Q230,210 300,195 L430,185 Q500,185 530,205 L580,240 L220,270 Z" fill="#0a3d62" opacity="0.7"/>
  <!-- Front wheel -->
  <circle cx="230" cy="320" r="45" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="230" cy="320" r="30" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="230" cy="320" r="8" fill="#555"/>
  <!-- Rear wheel -->
  <circle cx="580" cy="320" r="45" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="580" cy="320" r="30" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="580" cy="320" r="8" fill="#555"/>
  <text x="400" y="440" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16" font-weight="600">SEDAN - SIDE PROFILE</text>
  <text x="400" y="465" text-anchor="middle" fill="#444" font-family="system-ui" font-size="12">Full wheel visible - Easy replacement</text>
  <rect x="300" y="30" width="200" height="30" rx="15" fill="#3b82f6" opacity="0.15"/>
  <text x="400" y="50" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="11" font-weight="500">Replace with real photo</text>
</svg>
