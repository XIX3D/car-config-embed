<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <rect x="0" y="380" width="800" height="120" fill="#0f0f1a" opacity="0.6"/>
  <!-- Car body -->
  <path d="M200,300 Q220,200 350,190 L500,185 Q580,185 620,220 L680,260 L700,280 L700,320 L160,320 L160,300 Z" fill="#2a2a4a" stroke="#3a3a6a" stroke-width="2"/>
  <!-- Windows -->
  <path d="M280,270 Q290,210 370,200 L480,195 Q540,195 570,220 L600,250 L280,270 Z" fill="#0a3d62" opacity="0.7"/>
  <!-- Front wheel -->
  <circle cx="280" cy="320" r="42" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="280" cy="320" r="28" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="280" cy="320" r="8" fill="#555"/>
  <!-- Rear wheel -->
  <circle cx="600" cy="320" r="42" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="600" cy="320" r="28" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="600" cy="320" r="8" fill="#555"/>
  <!-- Labels -->
  <text x="400" y="440" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16" font-weight="600">SEDAN - FRONT 3/4 VIEW</text>
  <text x="400" y="465" text-anchor="middle" fill="#444" font-family="system-ui" font-size="12">Normal wheel position - Standard angle</text>
  <!-- Replace indicator -->
  <rect x="300" y="30" width="200" height="30" rx="15" fill="#3b82f6" opacity="0.15"/>
  <text x="400" y="50" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="11" font-weight="500">Replace with real photo</text>
</svg>
