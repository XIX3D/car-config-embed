<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)"/>
  <rect x="0" y="380" width="800" height="120" fill="#0f0f1a" opacity="0.6"/>
  <!-- Car body - rear 3/4 view (mirrored perspective) -->
  <path d="M100,280 L120,260 Q160,200 280,190 L450,185 Q560,185 600,210 L680,260 L680,300 L680,320 L100,320 Z" fill="#2a2a4a" stroke="#3a3a6a" stroke-width="2"/>
  <!-- Rear window -->
  <path d="M200,265 Q210,215 280,200 L440,192 Q520,192 550,210 L590,245 L200,265 Z" fill="#0a3d62" opacity="0.7"/>
  <!-- Taillights -->
  <rect x="108" y="275" width="25" height="12" rx="3" fill="#cc0000" opacity="0.8"/>
  <!-- Rear wheel - partially obscured -->
  <circle cx="210" cy="320" r="42" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="210" cy="320" r="28" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="210" cy="320" r="8" fill="#555"/>
  <!-- Front wheel - foreshortened -->
  <ellipse cx="570" cy="320" rx="38" ry="42" fill="#111" stroke="#333" stroke-width="3"/>
  <ellipse cx="570" cy="320" rx="25" ry="28" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="570" cy="320" r="8" fill="#555"/>
  <text x="400" y="440" text-anchor="middle" fill="#e67e22" font-family="system-ui" font-size="16" font-weight="600">SEDAN - REAR 3/4 VIEW</text>
  <text x="400" y="465" text-anchor="middle" fill="#d35400" font-family="system-ui" font-size="12">Foreshortened front wheel - Tricky angle</text>
  <rect x="300" y="30" width="200" height="30" rx="15" fill="#e67e22" opacity="0.15"/>
  <text x="400" y="50" text-anchor="middle" fill="#e67e22" font-family="system-ui" font-size="11" font-weight="500">Challenging angle</text>
</svg>
