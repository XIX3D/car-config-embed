<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <rect x="0" y="380" width="800" height="120" fill="#0f0f1a" opacity="0.6"/>
  <!-- SUV body - taller -->
  <path d="M180,310 L180,250 Q190,160 320,150 L480,145 Q560,145 600,180 L660,230 L690,260 L690,320 L150,320 L150,310 Z" fill="#2a2a4a" stroke="#3a3a6a" stroke-width="2"/>
  <!-- Windows -->
  <path d="M260,250 Q270,175 340,165 L470,155 Q530,155 555,180 L590,220 L260,250 Z" fill="#0a3d62" opacity="0.7"/>
  <!-- Front wheel - bigger for SUV -->
  <circle cx="270" cy="320" r="48" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="270" cy="320" r="32" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="270" cy="320" r="9" fill="#555"/>
  <!-- Rear wheel -->
  <circle cx="590" cy="320" r="48" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="590" cy="320" r="32" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="590" cy="320" r="9" fill="#555"/>
  <text x="400" y="440" text-anchor="middle" fill="#666" font-family="system-ui" font-size="16" font-weight="600">SUV - FRONT 3/4 VIEW</text>
  <text x="400" y="465" text-anchor="middle" fill="#444" font-family="system-ui" font-size="12">Large wheels - Higher ride height</text>
  <rect x="300" y="30" width="200" height="30" rx="15" fill="#3b82f6" opacity="0.15"/>
  <text x="400" y="50" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="11" font-weight="500">Replace with real photo</text>
</svg>
