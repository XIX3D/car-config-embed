<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg4)"/>
  <rect x="0" y="400" width="800" height="100" fill="#0f0f1a" opacity="0.6"/>
  <!-- Coupe body - low angle perspective, wheels appear larger -->
  <path d="M140,340 L150,280 Q170,200 320,185 L500,178 Q590,178 640,210 L710,260 L730,300 L730,350 L120,350 Z" fill="#2a2a4a" stroke="#3a3a6a" stroke-width="2"/>
  <!-- Windows - sloped -->
  <path d="M260,300 Q275,215 360,200 L490,192 Q550,192 580,215 L620,250 L260,290 Z" fill="#0a3d62" opacity="0.7"/>
  <!-- Front wheel - exaggerated size from low angle -->
  <circle cx="260" cy="348" r="55" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="260" cy="348" r="38" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="260" cy="348" r="10" fill="#555"/>
  <!-- Rear wheel -->
  <circle cx="620" cy="348" r="50" fill="#111" stroke="#333" stroke-width="3"/>
  <circle cx="620" cy="348" r="34" fill="#1a1a1a" stroke="#444" stroke-width="2"/>
  <circle cx="620" cy="348" r="9" fill="#555"/>
  <text x="400" y="440" text-anchor="middle" fill="#e67e22" font-family="system-ui" font-size="16" font-weight="600">COUPE - LOW ANGLE SHOT</text>
  <text x="400" y="465" text-anchor="middle" fill="#d35400" font-family="system-ui" font-size="12">Tricky perspective - Exaggerated wheel size</text>
  <rect x="300" y="30" width="200" height="30" rx="15" fill="#e67e22" opacity="0.15"/>
  <text x="400" y="50" text-anchor="middle" fill="#e67e22" font-family="system-ui" font-size="11" font-weight="500">Challenging angle</text>
</svg>
